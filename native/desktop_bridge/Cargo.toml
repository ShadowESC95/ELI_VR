[package]
name = "eli-vr-desktop-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform localhost desktop-frame bridge for ELI VR"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = true, features = ["jpeg"] }
xcap = "=0.9.8"
